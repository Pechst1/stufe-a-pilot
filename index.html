<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stufe-A-Befragung</title>
<style>
/* Layout: sticky header with timer and section progress; chat column (agent questions, answers, current question card) plus a time panel on wide screens */
:root{
  --bg:#F1F4F6; --surface:#FFFFFF; --surface-2:#E7ECF0; --ink:#15202A; --muted:#566271; --line:#D3DAE1;
  --accent:#155E75; --accent-ink:#FFFFFF; --accent-soft:#DCEBF1; --you:#155E75; --you-ink:#FFFFFF;
  --warn:#94570A; --warn-soft:#FBEFD9; --ok:#2B7647; --ok-soft:#DFF0E5; --focus:#0E7490;
  --f-ui:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1318; --surface:#161D24; --surface-2:#1F2831; --ink:#E3E9EF; --muted:#98A4B2; --line:#2B3641;
    --accent:#5DB6D3; --accent-ink:#07202A; --accent-soft:#14323D; --you:#1D566A; --you-ink:#EAF6FA;
    --warn:#E6AD5E; --warn-soft:#3A2B14; --ok:#6CC791; --ok-soft:#15301F; --focus:#5DB6D3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1318; --surface:#161D24; --surface-2:#1F2831; --ink:#E3E9EF; --muted:#98A4B2; --line:#2B3641;
  --accent:#5DB6D3; --accent-ink:#07202A; --accent-soft:#14323D; --you:#1D566A; --you-ink:#EAF6FA;
  --warn:#E6AD5E; --warn-soft:#3A2B14; --ok:#6CC791; --ok-soft:#15301F; --focus:#5DB6D3; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-ui);}
#app{padding-inline:16px;padding-block:0 56px;}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
p{margin:0}
button{font:inherit}
.mono,.tag,.clock,.key,.ptime,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:is(button,input,select,textarea):focus-visible{outline:2px solid var(--focus);outline-offset:2px}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:500;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px;font-weight:500}
.btn.ghost:hover{color:var(--ink);border-color:transparent;background:var(--surface-2)}
.btn.ghost[aria-pressed="true"]{color:var(--accent);background:var(--accent-soft)}
.btn.small{padding:4px 8px;font-size:13px}

/* header */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);margin-inline:-16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px}
.brand .title{font-weight:600;font-size:16px}
.brand .sub{color:var(--muted);font-size:12.5px}
.ctrls{display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.clock{font-size:15px;font-weight:500;padding:4px 10px;border-radius:6px;background:var(--surface-2)}
.clock .of{color:var(--muted);font-weight:400}
.clock.over{background:var(--warn-soft);color:var(--warn)}
.prog{max-width:1180px;margin:8px auto 0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.seg{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent);border-radius:3px}
.seg.opt{opacity:.7}
.secname{max-width:1180px;margin:6px auto 0;font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.confirm{max-width:1180px;margin:8px auto 0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);color:var(--ink)}

/* layout */
.grid{max-width:1180px;margin:20px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:28px;align-items:start}
@media (min-width:820px){.grid{grid-template-columns:minmax(0,1fr) 270px}}
.chat{min-width:0;max-width:760px;width:100%;display:flex;flex-direction:column;gap:14px}
.thread{display:flex;flex-direction:column;gap:12px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.grp{color:var(--muted);font-size:12.5px;font-weight:500}
.bubble{border-radius:14px;padding:11px 14px;min-width:0;overflow-wrap:anywhere}
.bubble.agent{align-self:flex-start;max-width:min(640px,100%);background:var(--surface);border:1px solid var(--line);border-top-left-radius:4px}
.bubble.you{align-self:flex-end;max-width:min(560px,92%);background:var(--you);color:var(--you-ink);border-top-right-radius:4px;white-space:pre-wrap}
.bubble.you.special{background:var(--surface-2);color:var(--muted);font-style:italic}
.bubble.you ol{margin:0;padding-left:20px;white-space:normal}
.bubble.you .meta{opacity:.8;font-size:12.5px}
.bubble.agent.check{background:var(--warn-soft);border-color:transparent}

/* current card */
.card{position:relative;background:var(--surface);border:1px solid var(--accent);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 28px -20px rgba(10,30,45,.45)}
.card.check{border-color:var(--warn)}
.banner{font-size:12.5px;font-weight:500;color:var(--warn);background:var(--warn-soft);border-radius:6px;padding:4px 8px;align-self:flex-start}
.q{font-size:16.5px;font-weight:500;line-height:1.45}
.hint{color:var(--muted);font-size:13.5px}
.err{color:var(--warn);font-size:13.5px;font-weight:500}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;cursor:pointer;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.key{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;min-width:1.7em;text-align:center;padding:0 4px;line-height:1.6;flex:none}
.opt .chk{flex:none;width:16px;height:16px;margin-top:2px;border:1.5px solid var(--muted);border-radius:4px;display:grid;place-items:center}
.opt[aria-pressed="true"] .chk{border-color:var(--accent);background:var(--accent)}
.opt[aria-pressed="true"] .chk::after{content:"";width:8px;height:4px;border-left:2px solid var(--accent-ink);border-bottom:2px solid var(--accent-ink);transform:rotate(-45deg) translate(1px,-1px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],textarea,select{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:96px}
label{display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:var(--muted);min-width:0}
label .o{font-weight:400}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.foot-l{display:flex;flex-wrap:wrap;gap:2px}
.info{background:var(--surface-2);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.placeholder{font-size:12.5px;font-weight:500;color:var(--warn)}
.paused{position:absolute;inset:0;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:16px}

/* research tags */
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11.5px;color:var(--muted);background:var(--surface-2);border-radius:4px;padding:1px 6px}
.tag.prov{color:var(--warn);background:var(--warn-soft)}
.tag.id{color:var(--accent);background:var(--accent-soft);font-weight:500}
.rule{font-size:12.5px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px}

/* steps editor */
.steps{display:flex;flex-direction:column;gap:10px}
.step{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px;grid-template-columns:minmax(0,1fr)}
@media (min-width:640px){.step{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.step .full{grid-column:1/-1}}
.step-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.step-no{font-weight:600;font-size:13.5px;color:var(--ink)}

/* summary */
.sum{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.sum-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:9px 12px;border-top:1px solid var(--line);align-items:start}
.sum-row:first-child{border-top:0}
.sum-row .k{font-size:12.5px;color:var(--muted)}
.sum-row .v{font-size:14px;overflow-wrap:anywhere}
.sum-row .v ol{margin:2px 0 0;padding-left:18px}

/* process view */
.proc{display:flex;flex-direction:column;gap:2px}
.pstep{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.pstep.focal{border-color:var(--accent);background:var(--accent-soft)}
.pn{font-family:var(--f-mono);font-size:12px;width:22px;height:22px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;flex:none}
.pt{display:flex;flex-direction:column;gap:1px;font-size:13px;min-width:0;overflow-wrap:anywhere}
.pt span{color:var(--muted);font-size:12px}
.parrow{text-align:center;color:var(--muted);font-size:12px;line-height:1.2}
.proc-mobile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.proc-mobile summary{cursor:pointer;margin-bottom:6px}
.proc-head{max-width:1180px;margin:8px auto 0}
.proc-head .proc{max-height:45vh;overflow:auto;margin-top:6px}
@media (min-width:820px){.proc-mobile,.proc-head{display:none}}
/* panel */
.panel{display:none}
@media (min-width:820px){.panel{display:flex;flex-direction:column;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 112px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}}
.panel h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.prow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px}
.prow .pname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow.cur .pname{font-weight:600}
.ptime{font-size:12px}
.ptime span{color:var(--muted)}
.ptime.over{color:var(--warn)}
.pbar{grid-column:1/-1;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.pbar i.over{background:var(--warn)}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;font-size:13px}
.kv .num{text-align:right}

/* start + end pages */
.page{max-width:1080px;margin:28px auto 0;display:grid;grid-template-columns:minmax(0,1fr);gap:24px}
@media (min-width:900px){.page{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:600}
.page h1{font-size:30px;font-weight:600;letter-spacing:-.01em}
.lead{font-size:15.5px;max-width:62ch}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.box h2{font-size:15px;font-weight:600}
.note{font-size:13.5px;color:var(--muted)}
.radio{display:flex;gap:10px;align-items:flex-start;flex-direction:row;color:var(--ink);font-size:14px;cursor:pointer}
.radio input{margin-top:4px;accent-color:var(--accent)}
.radio small{display:block;color:var(--muted);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:12px;border-top:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
ul.plain,ol.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:14px}
details summary{cursor:pointer;font-weight:500}
details[open] summary{margin-bottom:8px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat .big{font-family:var(--f-mono);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.stat .lbl{font-size:12.5px;color:var(--muted)}
.pill{align-self:flex-start;font-size:12px;font-weight:500;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
#json{font-family:var(--f-mono);font-size:12px;min-height:260px;line-height:1.45}
.flash{font-size:13px;color:var(--ok)}
.resume{background:var(--accent-soft);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ---------- Instrument (Spezifikation v0.1, Stand 03.10.2026) ---------- */
const VERSION = '0.2-pilot · Spezifikation Stand 13.10.2026 (ohne KI-Modell)';
const STORE_KEY = 'stufeA-prototyp-v1';
const SECTIONS = [
  {id:'0',  name:'Start und Filter', target:90},
  {id:'1',  name:'Rolle und Use Case', target:120},
  {id:'2',  name:'Typischer Ablauf', target:240},
  {id:'3',  name:'Kontrolle und weitere Dimensionen', target:330},
  {id:'4',  name:'Veränderungen', target:150},
  {id:'5',  name:'Zusammenfassung und Kontakt', target:60},
  {id:'opt',name:'Vertiefung (optional)', target:300}
];
const SEC = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));
const ORDER = SECTIONS.map(s=>s.id);
const CORE_TARGET = 15*60*1000;
const VARIANTS = [
  {label:'Voll', short:'Variante voll', desc:'Alle Kernfragen in der Kernstrecke.'},
  {label:'Kürzung Stufe 1 (E8)', short:'Kürzung Stufe 1', desc:'F3.6, F3.7, F3.16 und F3.18 wandern in den optionalen Block.'},
  {label:'Kürzung Stufe 2 (E8)', short:'Kürzung Stufe 2', desc:'Zusätzlich F3.22 bis F3.24 (Aufgabenmerkmale).'}
];

function o(v,label,ex,extra){ return Object.assign({v:v,label:label,ex:ex||null}, extra||{}); }
const K_OPTS = [
  o('K1','Mensch entscheidet und handelt, die KI liefert nur Informationen oder Vorschläge'),
  o('K2','erst nach Freigabe durch einen Menschen'),
  o('K3','automatisch, wenn niemand rechtzeitig widerspricht'),
  o('K4','sofort; ein Mensch wird informiert oder prüft danach'),
  o('K5','sofort; ein Mensch schaut nur bei Bedarf oder gar nicht')
];
const KI_OPTS = [
  o('nichts','nichts'), o('erfasst','sammelt oder erfasst Informationen'), o('analysiert','analysiert oder bewertet'),
  o('schlaegt_vor','schlägt eine Entscheidung oder Antwort vor bzw. wählt aus'), o('fuehrt_aus','erstellt oder führt das Ergebnis selbst aus')
];
const JANEIN = [o('ja','ja'), o('nein','nein')];
const P6_WORDS = ['besser','neues modell','neuere modell','neue version','neuere version','modellwechsel','update','upgrade','genauer','zuverlässiger','leistungsfähiger','fähiger'];

function p8(field, sec, text){
  return {id:'P8-'+field, sec:sec, type:'open', probe:true, text:text,
    code:'P8 · Nachfrage zu '+field, rule:'Auslöser: offene Kernantwort kürzer als 20 Zeichen oder 4 Wörter.',
    cond:function(){ const v=A(field); return typeof v==='string' && !special(v) && (v.trim().length<20 || v.trim().split(/\s+/).length<4); }};
}

const ITEMS = [
  // Abschnitt 0
  {id:'F0.1', sec:'0', type:'consent', noUnknown:true, text:'Bevor wir beginnen, kurz zu dieser Befragung.', code:'consent'},
  {id:'F0.2', sec:'0', type:'single', text:'Ist die KI-Anwendung, über die Sie sprechen möchten, im regulären Betrieb im Einsatz, also nicht nur als Pilot oder Test?',
    opts:[o('regulaer','im regulären Betrieb'), o('pilot','im Pilotbetrieb mit echten Fällen'), o('test','nur Test oder Prototyp')],
    code:'status_betrieb · Filter (E7)', rule:'„nur Test oder Prototyp“ beendet die Befragung höflich (E7). Pilotbetrieb wird markiert.'},
  {id:'C-F0.2', sec:'0', type:'check', target:'F0.2', okLabel:'Im Pilot weitermachen', changeLabel:'Antwort ändern', code:'Filter E7 (im Pilot nur Hinweis)',
    rule:'In der echten Befragung endet sie hier höflich (E7). Im Pilot geht es nach Bestätigung weiter.',
    cond:function(){ return is('F0.2','test'); },
    msg:function(){ return 'Hinweis für den Pilot: In der echten Befragung würde sie hier enden, weil nur Anwendungen erfasst werden, die mit echten Fällen arbeiten. Möchten Sie für den Pilot trotzdem weitermachen?'; }},
  {id:'F0.3', sec:'0', type:'multi', text:'Wie sind Sie selbst an dieser Anwendung beteiligt?', hint:'Mehrere Antworten möglich.',
    opts:[o('fachlich_verantwortlich','verantworte sie fachlich'), o('entwickelt','habe sie (mit)entwickelt oder eingeführt'), o('nutzt','arbeite regelmäßig damit'), o('entscheidet_mit','entscheide über ihren Einsatz mit'), o('von_aussen','kenne sie eher von außen')],
    code:'beteiligung · Stufe-B-Kriterium'},
  // Abschnitt 1
  {id:'F1.1', sec:'1', type:'single', text:'Was ist Ihre Rolle im Unternehmen?', otherLabel:'Ihre Rolle',
    opts:[o('fachbereich','Fach- oder Prozessverantwortung'), o('produkt','Produkt- oder Projektmanagement'), o('ki_team','KI-, Daten- oder Automatisierungsteam'), o('it','Softwareentwicklung oder IT'), o('leitung','Geschäftsführung oder Bereichsleitung'), o('extern','externe Beratung oder Dienstleister'), o('sonstige','Andere Rolle (bitte selbst angeben)',null,{other:true})],
    code:'rolle (Auswahl + Sonstige, VP 08.10.)'},
  {id:'F1.2', sec:'1', type:'single', text:'In welcher Branche ist Ihr Unternehmen tätig?', otherLabel:'Ihre Branche',
    opts:[o('finanz','Finanzdienstleistung oder Versicherung'), o('gesundheit','Gesundheit oder Pharma'), o('energie','Energie oder Versorgung'), o('software','Software oder IT'), o('beratung','Beratung oder Professional Services'), o('industrie','Industrie oder Automotive'), o('logistik','Logistik'), o('oeffentlich','öffentlicher Sektor'), o('sonstige','Andere Branche (bitte selbst angeben)',null,{other:true})],
    code:'branche · Sampling-Matrix'},
  {id:'F1.3', sec:'1', type:'single', text:'Wie viele Beschäftigte hat Ihr Unternehmen etwa?',
    opts:[o('lt50','weniger als 50'), o('50-249','50 bis 249'), o('250-999','250 bis 999'), o('1000-9999','1.000 bis 9.999'), o('ge10000','10.000 oder mehr')], code:'groesse'},
  {id:'F1.4', sec:'1', type:'open', text:'Beschreiben Sie die Anwendung in ein bis zwei Sätzen: Wofür wird sie genutzt, und wer arbeitet damit?', code:'usecase_beschreibung'},
  // Abschnitt 2
  {id:'F2.1', sec:'2', agentOnly:true, type:'open', text:'Denken Sie an einen typischen Fall, den diese Anwendung in den letzten Wochen bearbeitet hat. Was löst ihn aus, was passiert dann Schritt für Schritt, und was kommt am Ende heraus?', ctx:'F1.4', code:'ablauf_roh'},
  Object.assign({agentOnly:true}, p8('F2.1','2','Können Sie den Ablauf etwas genauer beschreiben: Was passiert, bevor die KI ins Spiel kommt, was macht sie, und was passiert danach?')),
  {id:'F2.2', sec:'2', type:'steps', text:'Beschreiben Sie den Ablauf Ihrer Anwendung in drei bis fünf Schritten: Was passiert in jedem Schritt, was macht die KI dabei, und wann wird ihr Ergebnis wirksam?', ctx:'F1.4',

/* ---------- Helpers ---------- */

function steps(){ const r=A('F2.2r'); if(Array.isArray(r)) return r; const s=A('F2.2'); return Array.isArray(s)?s:[]; }
function monthIdx(d,late){ return d.y*12 + (d.m ? d.m-1 : (late?11:0)); }
function dateIssue(){
  const d=A('F4.4'); if(!d||!d.y) return null;

  if(monthIdx(d,false)>nowIdx) return 'Sie haben für die Veränderung '+(d.m?'':'das Jahr ')+fmtMonth(d)+' angegeben, also einen Zeitpunkt in der Zukunft. Ist das so gemeint, etwa weil sie geplant ist?';
  const s=A('F3.19'); if(s&&s.y && monthIdx(d,true)<monthIdx(s,false)) return 'Sie hatten angegeben, dass die Anwendung seit '+fmtMonth(s)+' im Einsatz ist. Die Veränderung lag laut Ihrer Angabe '+(d.m?'im ':'im Jahr ')+fmtMonth(d)+', also davor. Stimmt das so?';

}
const MONTHS=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function fmtMonth(d){ if(!d||!d.y) return ''; return d.m ? (MONTHS[d.m-1]+' '+d.y) : String(d.y); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function fmt(ms){ const s=Math.max(0,Math.round(ms/1000)); return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'); }
function effSec(id){ const it=BY[id]; if(!it) return '5'; if(it.e8 && it.e8<=S.variant) return 'opt'; return it.sec; }
function curSec(){ return S.reask ? '5' : effSec(S.current); }
function hasEx(it){ return !!it.qex || (it.opts||[]).some(function(x){return x.ex;}); }
function optText(op){ return op.label + (S.exOpen && op.ex ? ' ('+op.ex+')' : ''); }
function optLabel(it,v){ if(String(v).indexOf('anderes: ')===0) return 'Anderes: '+String(v).slice(9); const op=(it.opts||[]).find(function(x){return x.v===v;}); return op?op.label:String(v); }

function buildSeq(variant){
  const core=[], moved=[], opt=[];
  ITEMS.forEach(function(it){
    if(it.sec==='opt') opt.push(it.id);
    else if(it.e8 && it.e8<=variant) moved.push(it.id);

}
function findNext(fromId){

    const id=S.seq[i]; if(id==='END') return 'END';

/* ---------- Timing ---------- */
function curMs(){
  if(S.phase!=='run' || !S.current) return 0;
  if(S.paused) return Math.max(0, S.pausedAt - S.shownAt);
  return Math.max(0, Date.now() - S.shownAt);
}
function secTimes(){
  const t={}; ORDER.forEach(function(k){t[k]=0;});
  S.history.forEach(function(e){ t[e.sec]=(t[e.sec]||0)+e.ms; });
  if(S.phase==='run' && S.current) t[curSec()] += curMs();
  return t;
}
function coreMs(t){ return ['0','1','2','3','4','5'].reduce(function(a,k){return a+(t[k]||0);},0); }

/* ---------- Flow ---------- */
function makeDraft(it, v){
  switch(it.type){
    case 'multi': { const arr=Array.isArray(v)? v.slice() : []; let other=''; const sel=arr.map(function(x){ if(String(x).indexOf('anderes: ')===0){ other=String(x).slice(9); return 'anderes'; } return x; }); return {sel:sel, other:other}; }
    case 'open': case 'short': return {text: (typeof v==='string' && !special(v)) ? v : ''};
    case 'single': return (v && typeof v==='object') ? {pick:v.v, other:v.text||''} : {pick:null, other:''};
    case 'month': return {y: v&&v.y ? String(v.y) : '', m: v&&v.m ? String(v.m) : ''};
    case 'stopper': return {v: v&&v.v ? v.v : null, note: v&&v.note ? v.note : ''};
    case 'steps': {
      let base = Array.isArray(v) ? v : (it.id==='F2.2r' && Array.isArray(A('F2.2')) ? A('F2.2') : []);
      const st = base.map(function(x){return Object.assign({}, x);});
      while(st.length<3) st.push({aufgabe:'', ki_beitrag:'', kontrolle:'', mensch_rolle:''});
      return {steps: st};
    }
    default: return {};
  }
}
function setCurrent(id, prefill){

}
function submit(value){
  const id=S.current, it=BY[id];
  const ms=curMs();
  if(S.reask){
    const prev=S.answers[id];
    S.answers[id]=value;
    S.corrections.push({id:id, alt:prev, neu:value});
    S.history.push({id:id, ms:ms, sec:'5', v:value, correction:true, prev:prev});
    const ret=S.reask.returnTo; S.reask=null; setCurrent(ret);
    save(); render(); return;
  }
  S.answers[id]=value;
  S.history.push({id:id, ms:ms, sec:effSec(id), v:value});
  if(it.probe && S.probes.indexOf(id)<0) S.probes.push(id);
  if(id==='F0.1' && value!==true) return finish('keine_einwilligung');
  if(id==='OPT' && value!=='ja') return finish('fertig');
  const nx=findNext(id);
  if(nx==='END') return finish('fertig');
  setCurrent(nx); save(); render();
}
function goBackTo(target){
  while(S.history.length){
    const e=S.history.pop();
    if(e.correction){ S.answers[e.id]=e.prev; continue; }
    const v=S.answers[e.id]; delete S.answers[e.id];
    S.probes = S.probes.filter(function(p){return p!==e.id;});
    if(e.id===target){ setCurrent(target, v); break; }
  }
  S.backs++;
}

}

function renderHeader(ended){

function outline(variant){
  const seq=buildSeq(variant); const m={}; ORDER.forEach(function(k){m[k]={fest:0,bedingt:0};});

    const sec=(it.e8&&it.e8<=variant)?'opt':it.sec; if(it.cond) m[sec].bedingt++; else m[sec].fest++; });
  return m;
}

  }
  const title = S.endReason==='filter_test' ? 'Danke für Ihr Interesse.' : (S.endReason==='abgebrochen' ? 'Befragung beendet.' : 'Vielen Dank.');
  const lead = S.endReason==='filter_test' ? 'Diese Befragung richtet sich an KI-Anwendungen, die mit echten Fällen arbeiten. Für reine Tests oder Prototypen endet sie hier (E7).'
    : (S.endReason==='abgebrochen' ? 'Die Befragung wurde bei Frage '+esc(S.abortAt)+' beendet. Die bisherigen Antworten sind unten zusammengefasst.' : 'Die Befragung ist abgeschlossen. Unten steht die Auswertung für den Pilot.');
  const main=S.history.filter(function(e){return !e.correction;});
  const unk=main.filter(function(e){return e.v==='unknown';}).length, dec=main.filter(function(e){return e.v==='declined';}).length;
  const secRows=SECTIONS.map(function(s){ const ms=t[s.id]||0, n=main.filter(function(e){return e.sec===s.id;}).length; const over=ms>s.target*1000;
    return '<tr><td>'+esc(s.id==='opt'?'opt.':s.id)+' · '+esc(s.name)+'</td><td class="n"'+(over?' style="color:var(--warn)"':'')+'>'+fmt(ms)+'</td><td class="n">'+fmt(s.target*1000)+'</td><td class="n">'+n+'</td></tr>'; }).join('');
  const slow=main.slice().sort(function(a,b){return b.ms-a.ms;}).slice(0,6).map(function(e){ const it=BY[e.id]; const q=it.type==='check'?'Plausibilitätsfrage':(it.type==='consent'?'Einwilligung':it.text);
    return '<tr><td class="mono">'+esc(e.id)+'</td><td>'+esc(q.length>90?q.slice(0,88)+'…':q)+'</td><td class="n">'+fmt(e.ms)+'</td></tr>'; }).join('');
  const inTarget=core<=CORE_TARGET;
  const listOr=function(a){ return a.length? esc(a.join(', ')) : '–'; };
  return '<div class="page"><div class="col">'+
    '<div class="eyebrow">Pilotauswertung</div><h1>'+esc(title)+'</h1><p class="lead">'+lead+'</p>'+
    '<div class="stats"><div class="stat"><span class="lbl">Kernstrecke</span><span class="big">'+fmt(core)+'</span><span class="pill '+(inTarget?'ok':'warn')+'">'+(inTarget?'im Ziel (≤ 15:00)':'über Ziel (15:00)')+'</span></div>'+
      '<div class="stat"><span class="lbl">Vertiefung</span><span class="big">'+fmt(opt)+'</span><span class="lbl">Ziel 4 bis 6 Minuten</span></div>'+
      '<div class="stat"><span class="lbl">Antworten</span><span class="big">'+main.length+'</span><span class="lbl">'+unk+' × weiß nicht · '+dec+' × keine Angabe</span></div></div>'+
    '<div class="box"><h2>Zeit je Abschnitt</h2><div class="tbl-wrap"><table><thead><tr><th>Abschnitt</th><th class="n">Ist</th><th class="n">Ziel</th><th class="n">Antworten</th></tr></thead><tbody>'+secRows+'</tbody></table></div></div>'+
    '<div class="box"><h2>Längste Antwortzeiten</h2><div class="tbl-wrap"><table><thead><tr><th>ID</th><th>Frage</th><th class="n">Zeit</th></tr></thead><tbody>'+slow+'</tbody></table></div></div>'+
    '<div class="box"><h2>Protokoll</h2><div class="kv"><span>Nachfragen ausgelöst</span><span class="num">'+listOr(S.probes)+'</span><span>Beispiele angezeigt</span><span class="num">'+listOr(S.examples)+'</span><span>Plausibilitätsfragen</span><span class="num">'+listOr(S.checks.map(function(c){return c.id+' ('+c.ergebnis+')';}))+'</span><span>Korrekturen in der Zusammenfassung</span><span class="num">'+listOr(S.corrections.map(function(c){return c.id;}))+'</span><span>Schritte zurück</span><span class="num">'+S.backs+'</span></div></div>'+
    '</div><div class="col">'+
    '<div class="box"><h2>Fünf Fragen zum Pilot</h2>'+
      fbSelect('dauer','Wie kam Ihnen die Länge der Befragung vor?',['zu kurz','angemessen','etwas zu lang','deutlich zu lang'])+
      fbSelect('skala','Wie verständlich war die Frage „Wann wird das Ergebnis dieses Schritts wirksam?“ mit den Stufen K1 bis K5?',['sehr verständlich','eher verständlich','eher unklar','sehr unklar'])+
      '<label>Welche Frage war am schwersten zu beantworten, und warum?<textarea id="fb-schwer" data-fb="schwerste" rows="3">'+esc(FB().schwerste||'')+'</textarea></label>'+
      '<label>Hat sich etwas wiederholt oder unnatürlich angefühlt?<textarea id="fb-wdh" data-fb="wiederholt" rows="3">'+esc(FB().wiederholt||'')+'</textarea></label>'+
      '<label>Was fehlt oder sollte anders sein?<textarea id="fb-sonst" data-fb="sonstiges" rows="3">'+esc(FB().sonstiges||'')+'</textarea></label></div>'+
    '<div class="box"><h2>Ergebnis zum Weitergeben</h2><p class="note">Als Datei speichern und per Mail an Vincent schicken (oder kopieren und in die Mail einfügen). Bitte vorher prüfen, dass keine Namen oder vertraulichen Details enthalten sind.</p>'+
      '<div class="row"><button class="btn primary" data-act="download">Als Datei speichern</button><button class="btn" data-act="copy">Zusammenfassung kopieren</button><span class="flash" id="flash" role="status"></span></div>'+
      '<textarea id="json" readonly aria-label="Zusammenfassung als JSON">'+esc(JSON.stringify(buildCase(),null,2))+'</textarea></div>'+
    restart+'</div></div>';
}

/* ---------- Actions ---------- */
function pick(v){
  const it=BY[S.current]; const op=it.opts.find(function(x){return x.v===v;}); if(!op) return;
  if(op.other){ S.draft.pick=v; S.error=''; rerenderCard(); const f=document.getElementById('other-'+it.id); if(f) f.focus(); return; }
  submit(v);
}
function act(name, ds){
  const it=BY[S.current]; const d=S.draft;
  switch(name){
    case 'start': S.phase='run'; S.seq=buildSeq(S.variant); S.startedAt=Date.now(); setCurrent(findNext(null)); save(); render(); window.scrollTo(0,0); break;
    case 'resume': S=SAVED; SAVED=null; S.shownAt=Date.now(); S.paused=false; S.confirmEnd=false; save(); render(); break;
    case 'discard': SAVED=null; clearStore(); render(); break;
    case 'restart': { const keep={variant:S.variant, research:S.research, pilotId:S.pilotId, vignette:S.vignette}; clearStore(); SAVED=null; S=fresh(keep); render(); window.scrollTo(0,0); break; }
    case 'toggleResearch': S.research=!S.research; save(); render(); break;
    case 'pause': S.paused=true; S.pausedAt=Date.now(); save(); render(); break;
    case 'unpause': S.shownAt += Date.now()-S.pausedAt; S.paused=false; save(); render(); break;
    case 'endAsk': S.confirmEnd=true; render(); break;
    case 'endCancel': S.confirmEnd=false; render(); break;
    case 'endConfirm': finish('abgebrochen'); break;
    case 'consent': submit(ds.v==='1'); break;
    case 'pick': pick(ds.v); break;
    case 'submitOther': { const tx=(d.other||'').trim(); if(!tx){ S.error='Bitte kurz nennen, was gemeint ist.'; rerenderCard(); return; } submit({v:d.pick, text:tx}); break; }
    case 'toggle': {
      const op=it.opts.find(function(x){return x.v===ds.v;}); let sel=d.sel.slice(); const on=sel.indexOf(ds.v)>-1;
      if(op.exclusive) sel = on ? [] : [ds.v];
      else { sel = on ? sel.filter(function(x){return x!==ds.v;}) : sel.concat([ds.v]); sel = sel.filter(function(x){ const p=it.opts.find(function(y){return y.v===x;}); return !(p&&p.exclusive); }); }
      d.sel=sel; S.error=''; rerenderCard(); break;
    }
    case 'submitMulti': {
      if(!d.sel.length){ S.error='Bitte mindestens eine Antwort wählen oder unten „Weiß ich nicht“.'; rerenderCard(); return; }
      if(d.sel.indexOf('anderes')>-1 && !(d.other||'').trim()){ S.error='Bitte kurz nennen, was mit „Anderes“ gemeint ist.'; rerenderCard(); return; }
      submit(d.sel.map(function(x){ return x==='anderes' ? 'anderes: '+d.other.trim() : x; })); break; }
    case 'submitText': { const tx=(d.text||'').trim(); if(!tx){ S.error='Bitte eine Antwort eingeben oder unten eine der Optionen wählen.'; rerenderCard(); return; } submit(tx); break; }
    case 'submitMonth': if(!d.y){ S.error='Bitte mindestens das Jahr wählen.'; rerenderCard(); return; } submit({y:+d.y, m:d.m?+d.m:null}); break;
    case 'stepPick': submit(+ds.v); break;
    case 'stopPick': d.v=ds.v; S.error=''; rerenderCard(); break;
    case 'submitStopper': if(!d.v){ S.error='Bitte eine Antwort wählen.'; rerenderCard(); return; } submit({v:d.v, note:d.v==='keiner'?'':(d.note||'').trim()}); break;
    case 'unknown': submit('unknown'); break;
    case 'declined': submit('declined'); break;
    case 'showEx': S.exOpen=true; if(S.examples.indexOf(S.current)<0) S.examples.push(S.current); save(); rerenderCard(); break;
    case 'back': { if(!S.history.length) return; const last=S.history[S.history.length-1]; goBackTo(last.id); save(); render(); break; }
    case 'checkOk': S.checks.push({id:S.current, ergebnis:'stimmt so'}); submit('ok'); break;
    case 'checkChange': S.checks.push({id:S.current, ergebnis:'geändert'}); goBackTo(it.target); save(); render(); break;
    case 'edit': { const id=ds.v; S.reask={id:id, returnTo:'F5.1'}; const v=S.answers[id]; S.current=id; S.shownAt=Date.now(); S.exOpen=false; S.error=''; S.draft=makeDraft(BY[id], v); save(); render(); break; }
    case 'summaryOk': submit('bestaetigt'); break;
    case 'stepAdd': if(d.steps.length<5){ d.steps.push({aufgabe:'',ki_beitrag:'',kontrolle:'',mensch_rolle:''}); rerenderCard(); } break;
    case 'stepDel': { const i=+ds.i; d.steps.splice(i,1); if(!d.steps.length) d.steps.push({aufgabe:'',ki_beitrag:'',kontrolle:'',mensch_rolle:''}); rerenderCard(); break; }
    case 'stepUp': { const i=+ds.i; if(i>0){ const x=d.steps[i]; d.steps[i]=d.steps[i-1]; d.steps[i-1]=x; rerenderCard(); } break; }
    case 'stepDown': { const i=+ds.i; if(i<d.steps.length-1){ const x=d.steps[i]; d.steps[i]=d.steps[i+1]; d.steps[i+1]=x; rerenderCard(); } break; }
    case 'stepSuggest': {
      if(d.steps.some(function(s){return s.aufgabe.trim();})){ S.error='Die Schritte sind schon ausgefüllt. Leeren Sie sie zuerst, wenn Sie neu vorschlagen lassen möchten.'; rerenderCard(); return; }
      const src=String(A('F2.1')||'');
      const parts=src.split(/[.!?;]+\s+|\s+(?:und dann|dann|danach|anschließend|anschliessend|schließlich|zum Schluss)\s+/i).map(function(x){return x.trim().replace(/[.!?;]+$/,'');}).filter(function(x){return x.length>3;}).slice(0,5);
      if(!parts.length){ S.error='In der Schilderung wurden keine Sätze gefunden.'; rerenderCard(); return; }
      d.steps=parts.map(function(p){ return {aufgabe:p.charAt(0).toUpperCase()+p.slice(1), ki_beitrag:'', kontrolle:'', mensch_rolle:''}; });
      S.error=''; rerenderCard(); break;
    }
    case 'submitSteps': {
      const filled=d.steps.filter(function(s){return s.aufgabe.trim();});
      if(!filled.length){ S.error='Bitte mindestens einen Schritt beschreiben oder unten „Weiß ich nicht“ wählen.'; rerenderCard(); return; }
      const miss=[]; filled.forEach(function(s){ const n=d.steps.indexOf(s)+1; if(!s.ki_beitrag || (s.ki_beitrag!=='nichts' && !s.kontrolle) || (s.ki_beitrag==='nichts' && !s.ausfuehrung)) miss.push(n); });
      if(filled.length<2){ S.error='Bitte mindestens zwei Schritte beschreiben: was vor der KI passiert und was danach.'; rerenderCard(); return; }
      if(miss.length){ S.error='Bei Schritt '+miss.join(', ')+' fehlt noch eine Angabe.'; rerenderCard(); return; }
      if(!filled.some(function(s){return s.ki_beitrag!=='nichts';})){ S.error='Mindestens ein Schritt sollte von der KI unterstützt werden.'; rerenderCard(); return; }
      submit(filled.map(function(s){ return {aufgabe:s.aufgabe.trim(), ki_beitrag:s.ki_beitrag, kontrolle:s.ki_beitrag==='nichts'?'':s.kontrolle, ausfuehrung:s.ki_beitrag==='nichts'?s.ausfuehrung:'ki'}; }));
      break;
    }
    case 'download': {
      const blob=new Blob([JSON.stringify(buildCase(),null,2)],{type:'application/json'}); const a=document.createElement('a');
      a.href=URL.createObjectURL(blob); a.download='stufe-a-pilot-'+(String(S.pilotId||'').replace(/[^A-Za-z0-9_-]/g,'')||'ohne-kuerzel')+'-'+new Date().toISOString().slice(0,10)+'.json';
      document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },1000);
      const fl=document.getElementById('flash'); if(fl) fl.textContent='Gespeichert. Bitte die Datei an die Mail anhängen.';
      break;
    }
    case 'copy': {
      const ta=document.getElementById('json'); const fl=document.getElementById('flash');
      const fallback=function(){ ta.focus(); ta.select(); if(fl) fl.textContent='Markiert. Bitte mit Strg/Cmd + C kopieren.'; };
      try{
        if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(ta.value).then(function(){ if(fl) fl.textContent='Kopiert.'; }, fallback); }
        else fallback();
      }catch(e){ fallback(); }
      break;
    }
  }
}

/* ---------- Events ---------- */
document.addEventListener('click', function(e){
  const t=e.target.closest('[data-act]'); if(!t || t.disabled) return;
  if(S && S.phase==='run' && t.closest('#card') && Date.now()-S.shownAt<400) return;
  if(S.paused && t.dataset.act!=='unpause' && t.dataset.act!=='toggleResearch') return;
  act(t.dataset.act, t.dataset);
});
function onField(e){
  const t=e.target;
  if(t.dataset.variant!==undefined){ S.variant=+t.dataset.variant; render(); return; }
  if(t.dataset.research){ S.research=t.checked; render(); return; }
  if(t.dataset.pilot){ S.pilotId=t.value.slice(0,12); save(); return; }
  if(t.dataset.vig){ S.vignette=t.checked; save(); return; }
  if(t.dataset.fb){ FB()[t.dataset.fb]=t.value; const j=document.getElementById('json'); if(j) j.value=JSON.stringify(buildCase(),null,2); save(); return; }
  if(S.phase!=='run') return;
  if(t.dataset.draft){ S.draft[t.dataset.draft]=t.value; if(S.error){ S.error=''; const er=document.querySelector('#card .err'); if(er) er.remove(); } save(); return; }
  if(t.dataset.field!==undefined && t.dataset.i!==undefined){ const s=S.draft.steps[+t.dataset.i]; if(!s) return;
    const f=t.dataset.field;
    if(f==='ki_beitrag'){ if(s.ki_beitrag===t.value){ return; } s.ki_beitrag=t.value; if(t.value==='nichts') s.kontrolle=''; else s.ausfuehrung=''; if(t.value==='fuehrt_aus' && s.kontrolle==='K1') s.kontrolle=''; save(); rerenderCard(); return; }
    s[f]=t.value; save(); }
}
document.addEventListener('input', onField);
document.addEventListener('change', function(e){ if(e.target.tagName==='SELECT' || e.target.type==='radio' || e.target.type==='checkbox') onField(e); });
document.addEventListener('keydown', function(e){
  if(!S || S.phase!=='run' || S.paused) return;
  const t=e.target; const tag=(t.tagName||'').toLowerCase(); const it=BY[S.current]; if(!it) return;
  if(tag==='textarea' && e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); act('submitText', {}); return; }
  if(tag==='input' && e.key==='Enter' && t.dataset.draft){ e.preventDefault(); const k=t.dataset.draft; if(k==='text') act('submitText',{}); else if(k==='other') act('submitOther',{}); else if(k==='note') act('submitStopper',{}); return; }
  if(tag==='input' || tag==='textarea' || tag==='select') return;
  if(/^[1-9]$/.test(e.key) && !e.metaKey && !e.ctrlKey && !e.altKey){
    if(it.type==='single'){ const op=it.opts[+e.key-1]; if(op){ e.preventDefault(); pick(op.v); } }
  }
});

/* ---------- Clock ---------- */
function tick(){
  if(!S || S.phase!=='run') return;
  const t=secTimes(); const core=coreMs(t); const optMs=t.opt||0;
  const c=document.getElementById('clock');
  if(c){ c.innerHTML=fmt(core)+' <span class="of">/ 15:00</span>'+(optMs>0?' <span class="of">+ '+fmt(optMs)+'</span>':''); c.classList.toggle('over', core>CORE_TARGET); }
  const p=document.getElementById('panel'); if(p && getComputedStyle(p).display!=='none') p.innerHTML=renderPanel();
}

/* ---------- Boot ---------- */
function start(data){
  if(data && data.state && data.state.phase) S=data.state;
  else { S=fresh(); SAVED=load(); if(SAVED && SAVED.phase!=='run') SAVED=null; }
  render();
  setInterval(tick, 1000);
}
try{ if(window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(function(){ return {state:S}; }); }catch(e){}
if(window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(start);
else start((window.claude && window.claude.hot && window.claude.hot.data) || {});
})();
</script>
